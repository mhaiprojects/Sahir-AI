[pytest]
testpaths = tests
addopts = -q
markers =
    slow: optional tests that load real STT models (deselect with -m "not slow")
    flaky_kws: Piper/Kokoro TTS wake detection; skipped unless SAHIR_RUN_FLAKY=1
    flaky_tts_audio: Moonshine/KWS on synthetic Piper audio; skipped unless SAHIR_RUN_FLAKY=1
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
